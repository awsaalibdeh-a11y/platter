<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Platter — your recipe box</title>
  <meta name="description" content="A recipe box with tags, a servings scaler, Cook Mode with timers, and one-tap import from any recipe link.">
  <meta name="theme-color" content="#fafaf8">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Platter">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/logo.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.themealdb.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ v }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='dark.css') }}?v={{ v }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='white.css') }}?v={{ v }}">
  <script nonce="{{ nonce }}">
    window.PLATTER = { v: "{{ v }}" };
    // pick the theme before the first paint, so nobody sees the wrong one flash
    try {
      var ui = JSON.parse(localStorage.getItem("platter.v1") || "{}").ui || {}, t = ui.theme || "white";
      if (t === "light" || (t === "auto" && ui.themeV !== 2)) t = "white";      // White is the default (see store.js)
      if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "white";
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = "white"; }
    // the door (static/js/gate.js): decided before the first paint, so a locked visitor never glimpses the recipes
    try {
      var g = JSON.parse(localStorage.getItem("platter.gate") || "{}") || {};
      document.documentElement.dataset.gate = g.ok ? "ok" : !g.wrongAt ? "ask" : Date.now() - g.wrongAt >= 1800000 ? "locked" : "trial";
    } catch (e) { document.documentElement.dataset.gate = "ask"; }
  </script>
</head>
<body>
  <div class="app" id="app" data-nav="detail" data-side="open">

    <!-- 1 · the menu and the tags -->
    <aside class="side" id="side" aria-label="Menu and tags">
      <div class="strip strip-side">
        <button class="ibtn" id="btn-sidebar" type="button" aria-label="Hide sidebar" title="Hide sidebar  ( [ )" data-icon="sidebar"></button>
      </div>
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6.4" fill="#d0e98a"/><rect x="6.2" y="5.2" width="3.4" height="14.2" rx="1.2" fill="#0e1800"/><circle cx="12.7" cy="10.4" r="4.2" fill="none" stroke="#0e1800" stroke-width="3.4"/></svg></span>
        <span class="wordmark">Platter</span>
        <button class="newbtn" id="btn-add" type="button" title="Add a recipe: import a link, snap a page, or write your own  ( N )"><span data-icon="plus"></span>Add recipe</button>
      </div>
      <button class="gsearch" id="btn-search" type="button" aria-label="Search recipes, tags and actions"><span data-icon="search"></span><span>Search everything</span><kbd id="gsearch-key">Ctrl K</kbd></button>
      <div class="side-scroll" id="side-scroll">
        <nav class="menu" aria-label="Main">
          <button class="mi" type="button" data-go="discover" data-tabbed title="Recipe of the day and ideas to browse  ( D )"><span class="mi-ic" data-icon="compass"></span><span class="mi-t">Discover</span></button>
          <button class="mi" type="button" data-go="ai" title="Say what you feel like, get dishes to pick from  ( A )"><span class="mi-ic" data-icon="sparkle"></span><span class="mi-t">Ask AI</span></button>
          <button class="mi" type="button" data-go="fav" title="The recipes you starred"><span class="mi-ic" data-icon="star"></span><span class="mi-t">Favorites</span></button>
          <button class="mi" type="button" data-go="plan" data-tabbed title="Plan the week, shop for it in one tap  ( M )"><span class="mi-ic" data-icon="calendar"></span><span class="mi-t">Meal plan</span><b class="qn" hidden></b></button>
          <button class="mi" type="button" data-go="shop" data-tabbed title="Everything you need, sorted by aisle  ( S )"><span class="mi-ic" data-icon="cart"></span><span class="mi-t">Shopping list</span><b class="qn" hidden></b></button>
          <button class="mi" type="button" data-go="pantry" title="Rank recipes by what's in your kitchen  ( P )"><span class="mi-ic" data-icon="jar"></span><span class="mi-t">What can I make?</span></button>
          <button class="mi" type="button" data-go="stats" title="What you've cooked, your streak, your favorites  ( Y )"><span class="mi-ic" data-icon="chefHat"></span><span class="mi-t">Your kitchen</span></button>
          <button class="mi" type="button" id="btn-folder" aria-haspopup="menu" title="All recipes, recently viewed, top rated, your cookbooks"><span class="mi-ic" data-icon="folder"></span><span class="mi-t">Collections &amp; cookbooks</span><span class="mi-more" data-icon="chevronRight"></span></button>
        </nav>
        <div class="side-h">
          <h2>Tags</h2>
          <button class="textbtn" id="btn-tags" type="button" aria-pressed="false" title="Rename, re-cover, hide or add tags">Edit</button>
        </div>
        <div class="tiles" id="tiles" role="list">
          <div class="tile sk"></div><div class="tile sk"></div><div class="tile sk"></div><div class="tile sk"></div>
          <div class="tile sk"></div><div class="tile sk"></div><div class="tile sk"></div><div class="tile sk"></div>
        </div>
      </div>
      <div class="side-foot">
        <button class="mi" type="button" id="btn-people" data-go="settings" title="Appearance, units, diet, prices, your data, help"><span class="mi-ic" data-icon="gear"></span><span class="mi-t">Settings</span></button>
        <button class="ibtn themebtn" id="btn-theme" type="button" aria-label="Switch light and dark" title="Light / dark  ( T )" data-icon="moon"></button>
      </div>
    </aside>

    <!-- 2 · recipes in the tag -->
    <section class="list" id="list" aria-label="Recipes">
      <div class="strip strip-list">
        <button class="back" id="back-tags" type="button"><span data-icon="chevron"></span><span>Tags</span></button>
        <button class="ibtn side-show" id="btn-sidebar-show" type="button" aria-label="Show sidebar" title="Show sidebar  ( [ )" data-icon="sidebar"></button>
      </div>
      <header class="list-head">
        <div>
          <h2 class="list-title" id="list-title">Recipes</h2>
          <p class="list-count" id="list-count" aria-live="polite">&nbsp;</p>
        </div>
        <button class="sortbtn" id="sort-btn" type="button" aria-haspopup="menu" title="Sort, and filter by diet, time, video…"><span data-icon="sliders"></span>Sort &amp; filter</button>
      </header>
      <div class="search-row">
        <div class="search">
          <span class="search-ic" data-icon="search"></span>
          <input id="search" type="text" inputmode="search" placeholder="Search this tag" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search this tag" enterkeyhint="search">
          <button class="search-clear" id="search-clear" type="button" hidden aria-label="Clear search" data-icon="x"></button>
        </div>
      </div>
      <div class="qfilters" id="qfilters" role="toolbar" aria-label="Quick filters"></div>
      <div class="filter-row" id="filter-row" hidden></div>
      <div class="rows" id="rows" role="listbox" aria-label="Recipes"></div>
    </section>

    <!-- 3 · the recipe -->
    <main class="detail" id="detail">
      <div class="strip strip-detail">
        <button class="back" id="back-list" type="button"><span data-icon="chevron"></span><span class="back-label">Recipes</span></button>
      </div>
      <div class="detail-top" id="detail-top"></div>
      <div class="detail-scroll" id="detail-scroll"></div>
    </main>

    <div class="side-scrim" id="side-scrim"></div>
  </div>

  <!-- phones: the main places, always one tap away -->
  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button class="tab" type="button" data-tab="discover"><span data-icon="compass"></span><b>Discover</b></button>
    <button class="tab" type="button" data-tab="recipes"><span data-icon="book"></span><b>Recipes</b></button>
    <button class="tab" type="button" data-tab="search"><span data-icon="search"></span><b>Search</b></button>
    <button class="tab" type="button" data-tab="plan"><span data-icon="calendar"></span><b>Plan</b></button>
    <button class="tab" type="button" data-tab="shop"><span data-icon="cart"></span><b>List</b><i class="qn" hidden></i></button>
  </nav>

  <div id="layer"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">Platter needs JavaScript to run.</p></noscript>

  <script defer src="{{ url_for('static', filename='js/util.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/store.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/ui.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/gate.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/diet.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/prices.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/settings.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/palette.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/cook.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/shop.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/plan.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/pantry.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/help.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/aitools.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/books.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/share.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/steps.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/discover.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/gallery.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/ai.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/views.js') }}?v={{ v }}"></script>
  <script defer src="{{ url_for('static', filename='js/main.js') }}?v={{ v }}"></script>
</body>
</html>
